name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run CPU smoke tests (interpret=True)
        run: |
          pytest tests/test_gdn2_full_math_correctness.py -v --tb=short
        env:
          JAX_PLATFORMS: cpu
          GDN2_FWD_DIAG: "0"

      - name: Run extended CPU correctness (mini)
        run: |
          # If a mini/skip-TPU version of deep tests exists, run it here.
          # For now we rely on the main smoke test above.
          echo "Extended TPU tests are skipped in CI (no TPU runners)."
