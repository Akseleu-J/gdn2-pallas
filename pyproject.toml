[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdn2-pallas"
version = "0.2.0"
description = "Fused Gated DeltaNet-2 kernels for TPU v5e (JAX/Pallas)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24",
]
license = {text = "MIT"}
authors = [{name = "Omirbay Akseleu", email = "omirbajakseleu5@gmail.com"}]
keywords = ["jax", "pallas", "tpu", "gated-deltanet2", "deltanet", "linear-attention", "gated-linear-attention"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]

[project.urls]
Homepage = "https://github.com/Akseleu-J/gdn2-pallas"
Repository = "https://github.com/Akseleu-J/gdn2-pallas"
Issues = "https://github.com/Akseleu-J/gdn2-pallas/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
[tool.setuptools.packages.find]
include = ["atomic_ops*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
atomic_ops = ["py.typed"]
