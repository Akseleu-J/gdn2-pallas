[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdn2-pallas"
version = "0.2.0"
description = "Fused Gated DeltaNet-2 kernels for TPU v5e (Pallas/JAX)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/Akseleu-J/gdn2-pallas"
